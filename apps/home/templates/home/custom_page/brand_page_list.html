{% extends 'base/base.html' %}
{% load static %}
{% block css %}
    <style>
        .ln-letters {
            width: fit-content;
            margin: 0 auto;
        }
        .ln-letters a {
            border: 1px solid #ff6666;
        }
        .ln-letters .ln-last {
            border-right: 1px solid #ff6666;
        }
        .ln-letters .ln-disabled {
            color: black;
        }
        .ln-letters a:hover, .ln-letters .ln-selected {
            background-color: #ff6666;
        }

        .cards-list {
          z-index: 0;
          width: 100%;
          display: flex;
          justify-content: space-around;
          flex-wrap: wrap;
        }

        .card {
          margin: 30px auto;
          width: 200px;
          height: 150px;
          border-radius: 40px;
          box-shadow: 5px 5px 30px 7px rgba(0,0,0,0.25), -5px -5px 30px 7px rgba(0,0,0,0.22);
          cursor: pointer;
          transition: 0.4s;
        }

        .card .card_image {
          width: inherit;
          height: inherit;
          border-radius: 40px;
        }

        .card .card_image img {
          width: inherit;
          height: inherit;
          border-radius: 40px;
          {#object-fit: cover;#}
        }

        .card .card_title {
          text-align: center;
          border-radius: 0px 0px 40px 40px;
          font-family: sans-serif;
          font-weight: bold;
          font-size: 14px;
          margin-top: -30px;
          height: 40px;
        }

        .card:hover {
          transform: scale(0.9, 0.9);
          box-shadow: 5px 5px 30px 15px rgba(0,0,0,0.25),
            -5px -5px 30px 15px rgba(0,0,0,0.22);
        }

        .title-white {
          color: white;
        }

        .title-black {
          color: black;
        }

        @media all and (max-width: 500px) {
          .card-list {
            /* On small screens, we are no longer using row direction but column */
            flex-direction: column;
          }
        }

{% endblock %}


{% block content %}
    <!-- Start menu -->
    {% include 'home/nav_category.html' %}

    <section id="aa-product-details">
        <div class="container">
            <div class="row">
                <div class="col-md-12">
                    <div class="aa-product-details-area">
                        <div class="aa-product-details-content">
                            <div id="brand_page_list" class="cards-list">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div></section>
{% endblock %}

{% block js %}

        const nav_category_api_url = "{% url 'main:home:api:v1:nav_category-list' %}";
