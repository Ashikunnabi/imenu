{% extends 'admin_base/base.html' %}
{% load static %}
{% block css %}
<style>
    .save_btn {
        display: block;
        text-align: center;
        width: 20% !important;
    }

    .ms-container,
    .search-input {
        width: 100%;
    }

    #shopProductDataTable,
    #shopOrderDataTable {
        width: 100% !important;
    }

    #shopProductDataTable .shop_product_checkbox,
    #shopProductDataTable .shop_product_save {
        scale: 2;
        cursor: pointer;
    }

    .table1 tfoot {
        border-top: 2px solid;
    }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid">

    <!-- Page Heading -->
    <div class="heading">
        <div class="d-sm-flex align-items-center justify-content-between mb-4">
            <h1 class="h3 mb-0 text-gray-800">Shop</h1>
            <!-- <a href="#" class="d-none d-sm-inline-block btn btn-sm btn-primary shadow-sm">
                <i class="fas fa-download fa-sm text-white-50"></i> Generate
                    Report
            </a> -->
        </div>
        <p class="mb-4">
            <!-- A sales order is a document generated by the seller specifying the details about the product or services
            ordered by the customer. -->
        </p>
    </div>


    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">Your Shop</h6>
        </div>
        <div class="card-body">

            <nav>
                <div class="nav nav-tabs" id="nav-tab" role="tablist">
                    <a class="nav-item nav-link active" id="nav-info-tab" data-toggle="tab" href="#nav-info" role="tab"
                        aria-controls="nav-info" aria-selected="true">Info</a>
                    <a class="nav-item nav-link" id="nav-employees-tab" data-toggle="tab" href="#nav-employees"
                        role="tab" aria-controls="nav-employees" aria-selected="false">Employees</a>
                    <a class="nav-item nav-link" id="nav-products-tab" data-toggle="tab" href="#nav-products" role="tab"
                        aria-controls="nav-products" aria-selected="false">Products</a>
                    <a class="nav-item nav-link" id="nav-orders-tab" data-toggle="tab" href="#nav-orders" role="tab"
                        aria-controls="nav-orders" aria-selected="false">Orders</a>
                </div>
            </nav>
            <div class="tab-content" id="nav-tabContent">
                <div class="tab-pane fade show active" id="nav-info" role="tabpanel" aria-labelledby="nav-info-tab">
                    <br>
                    <form id="shop_info_edit" data-parsley-validate enctype="multipart/form-data">
                        <div class="row">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="name">Name: <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="name" name="name"
                                        data-parsley-maxlength="100" placeholder="Enter name here (max 20 chars)."
                                        required>
                                    <label for="location">Location: <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="location" name="location"
                                        data-parsley-maxlength="100" placeholder="Enter location here (max 100 chars)."
                                        required>
                                    <label for="phone_numbers">Phone numbers: <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="phone_numbers" name="phone_numbers" data-parsley-maxlength="100"
                                        placeholder="Enter phone_numbers comma(,) seperated here (max 100 chars)." required>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="custom-control custom-checkbox small">
                                <input type="checkbox" class="custom-control-input" id="is_active" name="is_active">
                                <label class="custom-control-label" for="is_active">Active</label>
                            </div>
                        </div>
                        <input type="button" class="save_info save_btn btn btn-primary btn-group btn-block"
                            value="Save">
                    </form>
                </div>

                <div class="tab-pane fade" id="nav-employees" role="tabpanel" aria-labelledby="nav-employees-tab">
                    <br>
                    <select id="employee_list" multiple="multiple"></select>
                    <br>
                    <input type="button" class="save_employee save_btn btn btn-primary btn-group btn-block"
                        value="Save">
                </div>

                <div class="tab-pane fade" id="nav-products" role="tabpanel" aria-labelledby="nav-products-tab">
                    <br>
                    <div class="table-responsive">
                        <table class="table table-bordered table-hover row-select" id="shopProductDataTable">
                        </table>
                    </div>
                </div>

                <div class="tab-pane fade" id="nav-orders" role="tabpanel" aria-labelledby="nav-orders-tab">
                    <br>
                    <div class="table-responsive">
                        <table class="table table-bordered table-hover row-select" id="shopOrderDataTable">
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="exampleModalCenter" tabindex="-1" role="dialog"
        aria-labelledby="exampleModalCenterTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLongTitle">H0000<span id="order_id"></span></h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body" id="order_details_modal_body">
                    <table class="table table1">

                        <thead class="thead-gray">
                            <tr>
                                <th>Product</th>
                                <th>Qty</th>
                                <th>Price</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                        <tfoot></tfoot>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

</div>
{% endblock %}


{% block js %}





<script>
    const page = 'edit';
    const uuid = "{{ uuid }}";
    const list_api_url = "{% url 'apps:shop:api:v1:shop-list' %}";
    const list_user_api_url = "{% url 'apps:rbac:api:v1:staff-list' %}";
    const list_shopekeeper_api_url = "{% url 'apps:shop:api:v1:shopkeeper-list' %}?shop_uuid={{ uuid }}";
    const list_shop_product_api_url = "{% url 'apps:shop:api:v1:shop-product-list' %}?shop_uuid={{ uuid }}";
    const list_shop_order_api_url = "{% url 'apps:shop:api:v1:shop-order-list' %}?shop_uuid={{ uuid }}";
    const list_view_url = "{% url 'admin:admin_shop:shop_list' %}";
</script>

<!-- Finale Invoice JS -->
<script src="{% static 'admin_shop/js/shop.js' %}?v={{JS_VERSION}}"></script>
{% endblock %}
