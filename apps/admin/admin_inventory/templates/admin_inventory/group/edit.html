{% extends 'admin_base/base.html' %}
{% load static %}
{% block css %}
{% endblock %}

{% block content %}
<div class="container-fluid">

    <!-- Page Heading -->
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">Group</h1>
        <!-- <a href="#" class="d-none d-sm-inline-block btn btn-sm btn-primary shadow-sm"><i
                class="fas fa-download fa-sm text-white-50"></i> Generate
            Report</a> -->
    </div>
    <p class="mb-4">
        <!-- Only active group will be shown in home page.
            Groups are awesome for user experience.
            Please make sure you have full HD group images. -->
    </p>


    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">Group Edit</h6>
        </div>
        <div class="card-body">
            <form id="group_edit" data-parsley-validate enctype="multipart/form-data">
                <div class="form-group">
                    <label for="code">Code: <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="code" name="code" data-parsley-maxlength="50"
                        placeholder="Enter group code here (max 50 chars)." required>
                </div>
                <div class="form-group">
                    <label for="name">Name: <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="name" name="name" data-parsley-maxlength="50"
                        placeholder="Enter group name here (max 50 chars)." required>
                </div>

                <div class="form-group">
                    <label for="parent">Parent:</label>
                    <select class="form-control" id="parent_uuid" name="parent_uuid"></select>
                </div>

                <div class="form-group">
                    <label for="image">Image: (<a href="#" target="_blank" id="editGroupCurrentImage">Current
                            Image</a>):</label>
                    <input type="file" class="form-control" id="image" name="image">
                </div>

                <div class="form-group">
                    <div class="custom-control custom-checkbox small">
                        <input type="checkbox" class="custom-control-input" id="is_active" name="is_active">
                        <label class="custom-control-label" for="is_active">Active</label>
                    </div>
                </div>

                <input type="submit" class="btn btn-primary float-right">
            </form>
        </div>
    </div>

</div>
{% endblock %}


{% block js %}
<script>
    const page_type = "edit";
    const uuid = "{{ uuid }}";
    const api_urls = {
        "group_list": "{% url 'apps:inventory:api:v1:group-list-create' %}",
    }
    const group_list_url = "{% url 'admin:admin_inventory:group_list' %}";
</script>

<!-- Group JS -->
<script src="{% static 'admin_inventory/js/group.js' %}?v={{JS_VERSION}}"></script>
{% endblock %}
