{% extends 'admin_base/base.html' %}
{% load static %}
{% block css %}
{% endblock %}

{% block content %}
<div class="container-fluid">

    <!-- Page Heading -->
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">Brand</h1>
        <!-- <a href="#" class="d-none d-sm-inline-block btn btn-sm btn-primary shadow-sm"><i
                class="fas fa-download fa-sm text-white-50"></i> Generate
            Report</a> -->
    </div>
    <p class="mb-4">
        <!-- Only active brand will be shown in home page.
        Brands are awesome for user experience.
        Please make sure you have full HD brand images. -->
    </p>


    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">Brand Add</h6>
        </div>
        <div class="card-body">
            <form id="brand_add" data-parsley-validate enctype="multipart/form-data">
                <div class="form-group">
                    <label for="name">Name: <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="name" name="name" data-parsley-maxlength="50"
                        placeholder="Enter brand name here (max 50 chars)." required>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="text" class="form-control" id="email" name="email"
                        data-parsley-maxlength="50" placeholder="Enter brand email here.">
                </div>

                <div class="form-group">
                    <label for="address">Address:</label>
                    <textarea type="text" class="form-control" id="address" name="address"
                        data-parsley-maxlength="256" placeholder="Write address (max 256 chars)."></textarea>
                </div>

                <div class="form-group">
                    <label for="phone">Phone:</label>
                    <input type="text" class="form-control" id="phone" name="phone" data-parsley-maxlength="12"
                        placeholder="Enter phone number here.">
                </div>

                <div class="form-group">
                    <label for="url">URL:</label>
                    <input type="url" class="form-control" id="url" name="url"
                        placeholder="Enter company url here.">
                </div>

                <div class="form-group">
                    <label for="tagline">Tagline:</label>
                    <input type="text" class="form-control" id="tagline" name="tagline"
                        placeholder="Enter tagline here.">
                </div>

                <div class="form-group">
                    <label for="image">Image: </label>
                    <input type="file" class="form-control" id="image" name="image">
                </div>

                <div class="form-group">
                    <div class="custom-control custom-checkbox small">
                        <input type="checkbox" class="custom-control-input" id="is_active" name="is_active" checked>
                        <label class="custom-control-label" for="is_active">Active</label>
                    </div>
                </div>

                <input type="submit" class="btn btn-primary float-right">
            </form>
        </div>
    </div>

</div>
{% endblock %}


{% block js %}
<script>
    const page_type = "add";
    const api_urls = {
        "brand_list": "{% url 'apps:inventory:dashboard_api:v1:dashboard_brand_list_create' %}",
    }
    const brand_list_url = "{% url 'admin:admin_inventory:brand_list' %}";
</script>

<!-- Brand JS -->
<script src="{% static 'admin_inventory/js/brand.js' %}?v={{JS_VERSION}}"></script>
{% endblock %}
