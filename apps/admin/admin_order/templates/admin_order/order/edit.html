{% extends 'admin_base/base.html' %}
{% load static %}
{% block css %}
{% endblock %}

{% block content %}
    <div class="container-fluid">

        <!-- Page Heading -->
        <div class="d-sm-flex align-items-center justify-content-between mb-4">
            <h1 class="h3 mb-0 text-gray-800">Order</h1>
            {#        <a href="#"#}
            {#           class="d-none d-sm-inline-block btn btn-sm btn-primary shadow-sm"><i#}
            {#                class="fas fa-download fa-sm text-white-50"></i> Generate#}
            {#            Report</a>#}
        </div>
        <p class="mb-4">
            Get all orders in one place.
        </p>


        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">Order Details</h6>
            </div>
            <div class="card-body">
                <div id="order_detail"></div>
            </div>
        </div>

        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">Actions</h6>
            </div>
            <div class="card-body">
                <form id="order_detail_form" data-parsley-validate>

                    <div class="row">
                        <div class="col-md-12">
                            <div class="form-group">
                                <select class="form-control"
                                        id="status"
                                        name="status">
                                    <option value="created">Created</option>
                                    <option value="payment_pending">Payment Pending</option>
                                    <option value="new">New</option>
                                    <option value="processing">Processing</option>
                                    <option value="processed">Processed</option>
                                    <option value="error">Error</option>
                                    <option value="delivered">Delivered</option>
                                    <option value="cancelled">Cancelled</option>
                                    <option value="refunded">Refunded</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <br>

                    <input type="submit"
                           id="submit_changes"
                           class="btn btn-primary btn-user btn-block">
                </form>
            </div>
        </div>
    </div>
{% endblock %}


{% block js %}
    <script>
        const order_api_url = "{% url 'apps:order:api:v1:order_list_create' %}";
        const uuid = "{{ uuid }}";
        const page = 'edit';
    </script>

    <!-- user JS -->
    <script src="{% static 'admin_order/js/order.js' %}?v={{JS_VERSION}}"></script>
{% endblock %}
