version: "3"

services:
  web:
    build:
      context: .
      dockerfile: ./docker/web/Dockerfile
    image: imenu_web
    container_name: imenu_web
    command: /start
    restart: unless-stopped
    volumes:
      - .:/var/www/html:cached
    depends_on:
      - db
    networks:
      - imenu_network

  db:
    image: postgres:13.0-alpine
    container_name: imenu_db
    restart: unless-stopped
    volumes:
      - imenu_postgres_data:/var/lib/postgresql/data
      - imenu_postgres_data_dbback:/dbback
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    networks:
      - imenu_network

  nginx:
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
    image: imenu_nginx
    container_name: imenu_nginx
    restart: unless-stopped
    volumes:
      - .:/var/www/html:cached
    depends_on:
      - web
    ports:
      - "8082:80"
    networks:
      - imenu_network

networks:
    imenu_network:
        driver: bridge

volumes:
  imenu_postgres_data: {}
  imenu_postgres_data_dbback: {}
